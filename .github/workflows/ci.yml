name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12 # pin the actionlint binary too, not just the action

  # Fast and cheap: typecheck and bundle the GUI part on Linux.
  check:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from "packageManager")
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:gui

  # The Swift helper needs macOS + Xcode. macOS minutes cost more, so this job
  # only runs once the cheap checks pass.
  package:
    name: Build helper & package
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke-test helper
        run: |
          file bin/appshot-helper
          lipo bin/appshot-helper -verify_arch arm64 x86_64
          # Runners come with TCC pre-granted, so only check the JSON shape.
          bin/appshot-helper permissions | tee /dev/stderr | node -e '
            const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (typeof p.screenRecording !== "boolean" || typeof p.accessibility !== "boolean") process.exit(1);
          '
          bin/appshot-helper list | node -e 'if (!Array.isArray(JSON.parse(require("fs").readFileSync(0, "utf8")))) process.exit(1)'

      - name: Pack
        run: |
          mkdir -p out
          pnpm pack --pack-destination out
          tar -tzf out/*.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-appshot
          path: out/*.tgz
          if-no-files-found: error
